scaled_joint_trajectory_controller:
  ros__parameters:
    constraints:
      stopped_velocity_tolerance: 0.05  # Reduced from 0.2 - tighter velocity requirement
      goal_time: 0.0  # No time limit
      shoulder_pan_joint: { trajectory: 0.2, goal: 0.2 }  # Increased from 0.1
      shoulder_lift_joint: { trajectory: 0.2, goal: 0.2 }
      elbow_joint: { trajectory: 0.2, goal: 0.2 }
      wrist_1_joint: { trajectory: 0.2, goal: 0.2 }
      wrist_2_joint: { trajectory: 0.2, goal: 0.2 }
      wrist_3_joint: { trajectory: 0.2, goal: 0.2 }
